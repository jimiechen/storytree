<style>
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #cbc3d7;
            border-radius: 10px;
        }
    </style>

<body class="bg-background text-on-background font-body-md overflow-hidden">
<!-- Background Layer (Screenshot simulation) -->
<div class="fixed inset-0 z-0 w-full h-full bg-surface-container-highest" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBVxTALIStWbOA81jX0wUULQdTLPbmhkoF4_vhXbpnCV4MmQlaKc2q_Bm5XmVRvE6y_XXlLxc-Ghid-3-JSlDogBnDnG86qPOplRZprWiQ-8Sr9m53nJeSVpovg-PfOYjmmGddBHHHoIsWcTJvxxtr_sszNp76UiPBihkB6ihnrezSPgGoJKz87tEmxWvH-veFTye-P2uopzHMRzjO1ObYLwzOmn9KYgIqy693kWiwWTkEt9Fm7P97MHJwYC7T7I-vxfLqcIj5Ejnm4'); background-size: cover; background-position: center; filter: blur(2px);">
</div>
<!-- Overlay -->
<div class="fixed inset-0 z-40 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4">
<!-- Modal Container -->
<div class="bg-surface-container-lowest w-full max-w-2xl rounded-xl shadow-[0_8px_24px_rgba(0,0,0,0.08)] border border-outline-variant/30 flex flex-col max-h-[921px] overflow-hidden relative">
<!-- Header -->
<div class="flex items-center justify-between px-lg py-md border-b border-outline-variant">
<h2 class="text-headline-sm font-headline-sm text-on-surface">创建新项目</h2>
<button class="p-2 text-on-surface-variant hover:text-on-surface hover:bg-surface-container-low rounded-full transition-colors">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<!-- Content Area (Scrollable) -->
<div class="flex-1 overflow-y-auto custom-scrollbar p-lg">
<!-- Tabs -->
<div class="flex gap-4 border-b border-outline-variant mb-lg">
<button class="pb-sm border-b-2 border-primary text-primary text-label-md font-label-md font-bold flex items-center gap-2">
                        简易创作
                        <span class="bg-error-container text-on-error-container text-[10px] px-2 py-0.5 rounded-full font-bold">推荐</span>
</button>
<button class="pb-sm border-b-2 border-transparent text-on-surface-variant hover:text-on-surface text-label-md font-label-md transition-colors">
                        创建新项目
                    </button>
</div>
<form class="space-y-lg">
<!-- Basic Info Section -->
<div class="space-y-md">
<div>
<label class="block text-label-md font-label-md text-on-surface mb-xs">书名 <span class="text-error">*</span></label>
<input class="w-full bg-surface-bright border border-outline-variant rounded-lg px-4 py-3 text-body-md focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" placeholder="给你的小说起个名字" type="text"/>
</div>
<div>
<label class="block text-label-md font-label-md text-on-surface mb-xs">类型 <span class="text-error">*</span></label>
<div class="relative">
<select class="w-full bg-surface-bright border border-outline-variant rounded-lg px-4 py-3 text-body-md appearance-none focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors">
<option disabled="" selected="" value="">选择小说类型</option>
<option>玄幻</option>
<option>都市</option>
<option>穿越</option>
<option>科幻</option>
<option>仙侠</option>
<option>悬疑</option>
<option>其他</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-on-surface-variant">expand_more</span>
</div>
</div>
<div>
<label class="block text-label-md font-label-md text-on-surface mb-xs">简介</label>
<textarea class="w-full bg-surface-bright border border-outline-variant rounded-lg px-4 py-3 text-body-md focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors resize-none" placeholder="简单描述小说要讲什么故事..." rows="3"></textarea>
</div>
</div>
<hr class="border-outline-variant border-dashed"/>
<!-- Protagonist Setup Section -->
<div class="space-y-md">
<h3 class="text-label-md font-label-md text-on-surface font-bold flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-xl">person</span>
                            主角设定
                        </h3>
<div class="grid grid-cols-2 gap-md">
<div>
<label class="block text-label-sm font-label-sm text-on-surface-variant mb-xs">姓名</label>
<input class="w-full bg-surface-bright border border-outline-variant rounded-lg px-3 py-2 text-body-md focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" type="text"/>
</div>
<div>
<label class="block text-label-sm font-label-sm text-on-surface-variant mb-xs">年龄</label>
<input class="w-full bg-surface-bright border border-outline-variant rounded-lg px-3 py-2 text-body-md focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" type="number"/>
</div>
</div>
<div>
<label class="block text-label-sm font-label-sm text-on-surface-variant mb-sm">性别</label>
<div class="flex gap-4">
<label class="flex items-center gap-2 cursor-pointer">
<input checked="" class="text-primary focus:ring-primary w-4 h-4" name="gender" type="radio" value="male"/>
<span class="text-body-md">男</span>
</label>
<label class="flex items-center gap-2 cursor-pointer">
<input class="text-primary focus:ring-primary w-4 h-4" name="gender" type="radio" value="female"/>
<span class="text-body-md">女</span>
</label>
</div>
</div>
<div>
<label class="block text-label-sm font-label-sm text-on-surface-variant mb-xs">性格</label>
<textarea class="w-full bg-surface-bright border border-outline-variant rounded-lg px-4 py-3 text-body-md focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors resize-none" placeholder="描述主角的性格特点..." rows="2"></textarea>
</div>
</div>
<hr class="border-outline-variant border-dashed"/>
<!-- Custom Settings -->
<div>
<h3 class="text-label-md font-label-md text-on-surface font-bold mb-md flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-xl">tune</span>
                            自定义设定
                        </h3>
<textarea class="w-full bg-surface-bright border border-outline-variant rounded-lg px-4 py-3 text-body-md focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors resize-none" placeholder="添加修仙体系、科技设定等自定义内容..." rows="3"></textarea>
</div>
</form>
</div>
<!-- Footer Actions -->
<div class="px-lg py-md border-t border-outline-variant flex justify-end gap-md bg-surface-bright">
<button class="px-6 py-2 rounded-lg border border-outline-variant text-on-surface-variant font-label-md hover:bg-surface-container-low transition-colors" type="button">
                    取消
                </button>
<button class="px-8 py-2 rounded-lg bg-gradient-to-r from-primary to-primary-container text-on-primary font-label-md shadow-sm hover:opacity-90 transition-opacity flex items-center gap-2" type="button">
<span class="material-symbols-outlined text-sm">auto_awesome</span>
                    创建
                </button>
</div>
</div>
</div>
