<script>
        // Simple micro-interaction script for selecting options
        function selectOption(element) {
            // Remove selected class from all buttons
            const buttons = document.querySelectorAll('.option-card-hover');
            buttons.forEach(btn => btn.classList.remove('selected'));
            
            // Add selected class to clicked button
            element.classList.add('selected');
            
            // Optional: Enable "Next" button if it was disabled (not required by prompt but good UX)
