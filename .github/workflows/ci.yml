name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: caiode/vscode-extension/package-lock.json
      - name: Install dependencies
        working-directory: caiode/vscode-extension
        run: npm ci
      - name: Lint check
        working-directory: caiode/vscode-extension
        run: npm run lint
      - name: Format check
        working-directory: caiode/vscode-extension
        run: npm run format:check

  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: caiode/vscode-extension/package-lock.json
      - name: Install dependencies
        working-directory: caiode/vscode-extension
        run: npm ci
      - name: TypeScript check
        working-directory: caiode/vscode-extension
        run: npm run typecheck
      - name: Build
        working-directory: caiode/vscode-extension
        run: npm run build:prod
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: caiode/vscode-extension/dist/

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: caiode/vscode-extension/package-lock.json
      - name: Install dependencies
        working-directory: caiode/vscode-extension
        run: npm ci
      - name: Run tests
        working-directory: caiode/vscode-extension
        run: npm run test
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: caiode/vscode-extension/coverage/
